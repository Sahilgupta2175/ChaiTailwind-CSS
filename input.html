<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChaiTailwind Test Page</title>
    <script type="module" src="src/index.js"></script>
  </head>

  <body class="chai-bg-white">
    <div class="chai-p-32">
      <header class="chai-flex chai-items-center chai-justify-between chai-p-16">
        <h1 class="chai-text-blue chai-text-3xl chai-font-bold">ChaiTailwind</h1>
        <span class="chai-bg-green chai-text-white chai-p-8 chai-rounded-md">
          Ready
        </span>
      </header>

      <main
        class="chai-bg-blue chai-text-white chai-text-center chai-p-32 chai-rounded-lg"
      >
        <h2 class="chai-font-bold chai-text-xl">Utility Class Test</h2>
        <p class="chai-p-8 chai-text-sm">
          This page tests colors, spacing, flexbox, alignment, borders, radius,
          and font utilities.
        </p>
      </main>

      <section class="chai-p-16">
        <h2 class="chai-text-blue chai-font-bold">Login Form</h2>

        <form class="chai-flex chai-gap-8 chai-p-16">
          <input
            class="chai-p-8 chai-border-2 chai-border-gray chai-rounded-md"
            type="text"
            placeholder="Enter username"
          />
          <input
            class="chai-p-8 chai-border-2 chai-border-gray chai-rounded-md"
            type="password"
            placeholder="Enter password"
          />
          <button
            class="chai-bg-red chai-text-white chai-p-8 chai-rounded-lg chai-font-bold"
            type="submit"
          >
            Login
          </button>
        </form>
      </section>
    </div>
  </body>
</html>
