<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChaiTailwind Test Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-white">
    <div class="p-8">
      <header class="flex items-center justify-between p-4">
        <h1 class="text-blue font-bold">ChaiTailwind</h1>
        <span class="bg-green text-white p-2 rounded-md"> Ready </span>
      </header>

      <main class="bg-blue text-white p-8 rounded-lg">
        <h2 class="font-bold">Utility Class Test</h2>
        <p class="p-2">
          This page tests colors, spacing, flexbox, alignment, borders, radius,
          and font utilities.
        </p>
      </main>

      <section class="p-4">
        <h2 class="text-blue font-bold">Login Form</h2>

        <form class="p-4">
          <input
            class="w-8 p-2 border-2 rounded-md"
            type="text"
            placeholder="Enter username"
          />
          <input
            class="w-8 p-2 border-2 rounded-md"
            type="password"
            placeholder="Enter password"
          />
          <button
            class="bg-red text-white p-4 rounded-lg font-bold"
            type="submit"
          >
            Login
          </button>
        </form>
      </section>
    </div>
  </body>
</html>
